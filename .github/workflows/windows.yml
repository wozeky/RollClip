name: Render RollClip home on Windows
on:
  pull_request:
    branches: [ui/replay-dashboard]
  push:
    branches: [preview/dashboard-windows]
permissions:
  contents: write
jobs:
  screenshot:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the Windows app
        run: dotnet build src/RollClip.App -c Release -o build
      - name: Capture the native WPF home
        shell: pwsh
        run: |
          $marker = Join-Path $env:RUNNER_TEMP 'rollclip-window.txt'
          $app = Start-Process ./build/RollClip.exe -ArgumentList '--smoke-test', ('"' + $marker + '"') -PassThru
          $app.WaitForExit(45000) | Out-Null
          $image = [IO.Path]::ChangeExtension($marker, 'png')
          if (!(Test-Path $image)) { if (Test-Path $marker) { Get-Content $marker }; throw 'Home PNG missing' }
          Copy-Item $image RollClip-Windows.png
      - uses: actions/upload-artifact@v4
        with:
          name: RollClip-Windows
          path: RollClip-Windows.png
      - name: Save the requested PNG on the preview branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RollClip-Windows.png
          git commit -m 'Save native Windows home screenshot [skip ci]'
          git push origin HEAD:preview/dashboard-windows
