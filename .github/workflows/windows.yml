name: Windows UI preview
on:
  push:
    branches: [preview/liquid-glass-home]
permissions:
  contents: write
jobs:
  render:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/RollClip.App -c Release -o build
      - name: Prepare two real MP4 test clips
        shell: pwsh
        run: |
          $exe = (Get-Command ffmpeg -ErrorAction SilentlyContinue).Source
          if (!$exe) {
            choco install ffmpeg -y --no-progress
            $exe = (Get-ChildItem C:/ProgramData/chocolatey/lib/ffmpeg -Filter ffmpeg.exe -Recurse | Select-Object -First 1).FullName
          }
          if (!$exe) { throw 'FFmpeg not available for thumbnail verification' }
          New-Item build/ffmpeg/bin -Type Directory -Force
          Copy-Item $exe build/ffmpeg/bin/ffmpeg.exe
          $dir = Join-Path $env:RUNNER_TEMP 'rollclip-replay'
          New-Item $dir -Type Directory -Force
          & $exe -v error -f lavfi -i 'testsrc2=size=480x270:rate=15' -t 4 -c:v libx264 -pix_fmt yuv420p "$dir/replay-0.mp4"
          Copy-Item "$dir/replay-0.mp4" "$dir/replay-1.mp4"
      - name: Render and check native WPF views
        if: always()
        shell: pwsh
        run: |
          $marker = Join-Path $env:RUNNER_TEMP 'rollclip-window.txt'
          $app = Start-Process ./build/RollClip.exe -ArgumentList '--smoke-test', ('"' + $marker + '"') -PassThru
          if (!$app.WaitForExit(60000)) { throw 'WPF preview timed out' }
          if (Test-Path $marker) { Get-Content $marker }
          Copy-Item ([IO.Path]::ChangeExtension($marker,'png')) RollClip-Home.png
          $wide = [IO.Path]::ChangeExtension($marker,'wide.png')
          if ((Test-Path $wide) -and (Test-Path "$env:RUNNER_TEMP/rollclip-replay/replay-0.mp4")) { Copy-Item $wide RollClip-Clip.png }
          if ($app.ExitCode -ne 0) { throw "Smoke test failed: $($app.ExitCode)" }
      - name: Save Windows screenshots
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'RollClip-*.png'
          git commit -m 'Save Windows liquid glass previews [skip ci]'
          git push origin HEAD:preview/liquid-glass-home
